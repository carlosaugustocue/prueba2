# Copiar a Apache: sudo cp docs/serviconli-proxy.conf /etc/apache2/sites-available/serviconli.conf
# Luego: sudo a2ensite serviconli && sudo systemctl reload apache2
# Antes: sudo a2enmod proxy proxy_http rewrite
#
# Con esto, al abrir http://192.168.1.139 (puerto 80) Apache reenvía a Laravel en 127.0.0.1:8000.
# Debes tener Laravel corriendo: php artisan serve --host=127.0.0.1

<VirtualHost *:80>
    ServerName 192.168.1.139
    ServerAlias localhost

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
